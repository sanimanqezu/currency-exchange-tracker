services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: currency-tracker-app
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: currency_tracker
    ports:
    - 8080:8080
    restart: unless-stopped
    networks:
    - portfolio-net
networks:
  portfolio-net:
    external: true
